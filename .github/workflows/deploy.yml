# Автодеплой на GitHub Pages (официальный механизм):
# собирает проект и публикует папку dist как сайт при каждом пуше в main/master.
#
# После первого запуска ОБЯЗАТЕЛЬНО: Settings → Pages → Source → «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Подключение БД. Поддерживаются два пути (без конфликта):
      #   1) Секреты GitHub (Settings → Secrets and variables → Actions):
      #      VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY — они имеют приоритет
      #      и записываются в .env.production перед сборкой.
      #   2) Файл .env.production, закоммиченный в репозиторий (удобно для
      #      «импорта из Git» на любом хосте) — используется, если секретов нет.
      # Если не задано ничего — сайт собирается в локальном режиме (localStorage).
      - name: Apply Supabase config
        run: |
          if [ -n "$SB_URL" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$SB_URL" "$SB_KEY" > .env.production
            echo "→ Используем ключи из секретов GitHub"
          elif [ -f .env.production ]; then
            echo "→ Используем .env.production из репозитория"
          else
            echo "→ Ключи не заданы: локальный режим (localStorage)"
          fi
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build

      - name: Upload artifact (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
